<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Inspection Quotidienne — Appareils de levage</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#EEF1F5;color:#1A1A1A;padding-bottom:40px;}
:root{
  --rouge:#C8102E;--rouge-d:#8B0000;--rouge-l:#FDF0EF;
  --vert:#2E7D52;--vert-l:#E8F5EE;--vert-d:#1B5E38;
  --noir:#1A1A1A;--gris:#2C2C2C;--gris-l:#F2F2F2;--gris-brd:#999;--gris-m:#CCC;
  --blanc:#FFF;
}
.hdr{background:#1A1A1A;padding:14px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.3);border-bottom:4px solid var(--rouge);}
.hdr h1{font-size:15px;font-weight:700;color:#fff;}
.hdr p{font-size:10px;color:rgba(255,255,255,.55);margin-top:2px;}
.tabs{display:flex;background:#fff;border-bottom:3px solid var(--rouge);overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;}
.tab{flex-shrink:0;padding:12px 16px;font-size:12px;font-weight:700;color:#999;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;}
.tab.active{color:var(--rouge);border-bottom-color:var(--rouge);}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px;}
.eq-panel{display:none;}.eq-panel.active{display:block;}
.card{background:#fff;border:1px solid var(--gris-brd);margin-bottom:14px;}
.card-hdr{padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff;}
.h-noir{background:#1A1A1A;}.h-rouge{background:var(--rouge);}.h-vert{background:var(--vert);}.h-rougeD{background:var(--rouge-d);}
.card-body{padding:14px;}
.field{margin-bottom:11px;}
.field label{font-size:10px;font-weight:700;color:#1A1A1A;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--gris-brd);padding:10px;font-size:14px;font-family:Arial;outline:none;background:var(--gris-l);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rouge);border-width:2px;background:#fff;}
.field textarea{min-height:70px;resize:vertical;}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
/* Items inspection — grille jour */
.section-titre{background:var(--vert);color:#fff;padding:8px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between;}
.section-titre .jours{display:flex;gap:0;}
.section-titre .jours span{width:30px;text-align:center;font-size:11px;}
.insp-row{display:flex;align-items:stretch;border-bottom:1px solid #E5E5E5;}
.insp-row:nth-child(even){background:var(--gris-l);}
.insp-num{width:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#888;border-right:1px solid #E5E5E5;}
.insp-lbl{flex:1;padding:9px 8px;font-size:12px;line-height:1.3;display:flex;align-items:center;}
.insp-days{display:flex;flex-shrink:0;}
.day-cell{width:30px;border-left:1px solid #E5E5E5;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;font-size:15px;font-weight:700;}
.day-cell.ok{background:var(--vert);color:#fff;}
.day-cell.nok{background:var(--rouge);color:#fff;}
.initiales-row{display:flex;align-items:stretch;border-top:2px solid var(--gris-brd);background:#FFF8E0;}
.initiales-row .insp-lbl{font-weight:700;font-size:11px;text-transform:uppercase;}
.init-cell{width:30px;border-left:1px solid #E5E5E5;padding:0;}
.init-cell input{width:100%;height:100%;border:none;text-align:center;font-size:11px;padding:6px 2px;background:transparent;outline:none;}
.nonconf{display:none;}.nonconf.show{display:block;}
canvas.sig{border:2px solid var(--gris-brd);width:100%;background:#fff;touch-action:none;display:block;cursor:crosshair;min-height:120px;}
.btn-clear{background:var(--gris-l);border:1px solid var(--gris-brd);padding:7px 14px;font-size:11px;font-weight:700;color:#555;cursor:pointer;margin-top:6px;text-transform:uppercase;}
.btn-sub{width:100%;background:var(--vert);color:#fff;border:none;padding:16px;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;text-transform:uppercase;letter-spacing:.5px;}
.btn-sub:disabled{background:#aaa;}
.btn-pdf{width:100%;background:var(--rouge-d);color:#fff;border:none;padding:14px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;text-transform:uppercase;letter-spacing:.5px;}
.alerte{padding:14px;margin-bottom:14px;font-size:14px;line-height:1.5;display:none;border-left:5px solid;font-weight:600;}
.alerte.show{display:block;}
.al-ok{background:var(--vert-l);border-color:var(--vert);color:var(--vert-d);}
.note{background:#FFF8E0;border-left:4px solid #C8A000;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#5A4500;line-height:1.5;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:10px 22px;border-radius:4px;font-size:13px;font-weight:700;z-index:99;display:none;}
.toast.show{display:block;}
.hist-item{border:1px solid var(--gris-m);padding:10px 12px;margin-bottom:8px;background:var(--gris-l);}
@media(max-width:430px){.fg2{grid-template-columns:1fr;}.day-cell,.init-cell{width:26px;}.section-titre .jours span{width:26px;}}
</style>
</head>
<body>

<div class="hdr">
  <h1>🔧 Inspection quotidienne — Appareils de levage</h1>
  <p>École primaire Sainte-Bernadette — Arbour Construction</p>
</div>

<div class="tabs" id="tabs"></div>

<div class="wrap">
<div class="alerte al-ok" id="alertOk">✅ <strong>Inspection envoyée et enregistrée!</strong> Les données sont dans le registre SST.</div>

<div id="panels"></div>

<div class="card">

</div>
</div>

<div class="toast" id="toast"></div>

<script>
var APPS_URL = "https://script.google.com/macros/s/AKfycbytuCPaOLcBrw_zj78FUZLw7ExbWNnBWODkkKY8knpmPFZiWeIAKDOk_oICn9GHfw3adg/exec";

var EQUIPEMENTS = [

    sections:[

        "Système antichute conforme.",
        "Garde-corps conforme et en bon état.",
        "Boulons et écrous en bon état.",
        "Niveau de liquide selon les recommandations du fabricant.",
        "Jantes et boulons en bon état.",
        "Pneus en bon état.",
        "Vanne de descente en cas d'urgence bien indiquée.",
        "Composant électrique, hydraulique et pneumatique en bonne condition.",
        "Composante mobile protégée.",
        "Structure en bon état.",
        "Plaque signalétique, instruction et mise en garde lisible et complète.",
        "Commandes clairement indiquées et bouton d'arrêt d'urgence.",
        "Autres : Extincteur, stabilisateur (s'il y a lieu)."
      ]},
      {titre:"Inspection en marche", items:[

        "Phare, avertisseur lumineux fonctionnels.",
        "Commande de fonctionnement répondent bien.",
        "Commande d'urgence répond bien.",
        "Barrière de plateforme facile à enclencher et manœuvrer.",

        "Système de freinage d'urgence et frein de stationnement fonctionnels.",

        "Aucune fuite liquide."
      ]}
    ]
  },
  {
    nom:"Chariot élévateur", court:"Chariot",
    infos:[["marque","Marque / Modèle"],["modele","No de série"]],
    sections:[
      {titre:"Inspection visuelle", items:[

        "Pneus en bon état, fixation des roues serrée.",

        "Contrepoids en place et fixé.",

        "Aucune fuite (carburant, huile, hydraulique).",
        "Structure et protège-conducteur en bon état.",
        "Extincteur présent et accessible."
      ]},
      {titre:"Inspection en marche", items:[
        "Frein de service et frein de stationnement fonctionnels.",
        "Direction répond bien, pas de jeu excessif.",
        "Avertisseur sonore et alarme de recul fonctionnels.",
        "Phares, feux de recul et gyrophare fonctionnels.",
        "Commandes de levage et inclinaison répondent bien.",
        "Bouton d'arrêt d'urgence fonctionnel."
      ]}
    ]
  },
  {
    nom:"Élingues et accessoires", court:"Élingues",
    infos:[["marque","Type"],["modele","Capacité"]],
    sections:[
      {titre:"Inspection visuelle", items:[
        "Aucune déformation, torsion ou nœud.",
        "Aucune coupure, entaille ou abrasion.",
        "Aucune corrosion, rouille excessive ou piqûres.",
        "Crochets de sécurité fonctionnels et non déformés.",
        "Manilles : axe fileté serré et sécurisé.",
        "Plaque d'identification et capacité lisibles.",
        "Aucun allongement anormal des maillons (chaîne).",
        "Cosses en bon état aux extrémités (câble).",
        "Sangles textiles sans brûlure ni dégradation.",
        "Anneau de levage non déformé.",
        "Capacité adaptée à la charge prévue.",
        "Stockage adéquat (suspendu, propre, sec)."
      ]}
    ]
  },
  {
    nom:"Échafaudage", court:"Échafaudage",
    infos:[["marque","Localisation"],["modele","Hauteur"]],
    sections:[
      {titre:"Inspection visuelle", items:[
        "Montants verticaux sans déformation ni corrosion.",
        "Plaques de base stables, terrain nivelé.",
        "Ancrages et haubans en place selon exigences.",
        "Traverses horizontales en bon état et fixées.",
        "Planchers complets, aucun espace excessif.",
        "Planches fixées, ne basculent ni ne glissent.",
        "Garde-corps supérieur 900-1070 mm sur côtés exposés.",
        "Lisse intermédiaire mi-hauteur présente.",
        "Plinthe garde-pied 150 mm en place.",
        "Accès sécuritaire (échelle ou escalier en bon état).",
        "Aucun outil ou matériau non fixé sur la plateforme.",
        "Roues bloquées si échafaudage mobile.",
        "Filet de protection si risque de chute d'objets.",
        "Capacité de charge affichée, aucune surcharge."
      ]}
    ]
  },
  {
    nom:"Autre équipement", court:"Autre",
    infos:[["marque","Nom de l'équipement"],["modele","No de série"]],
    sections:[
      {titre:"Inspection", items:[
        "État général satisfaisant.",
        "Dispositifs de sécurité fonctionnels.",
        "Aucune fuite ou défectuosité visible.",
        "Plaque d'identification et capacité lisibles."
      ]}
    ]
  }
];

var JOURS = ["L","M","M","J","V"];
var S = {};      // S["eq_sec_item_jour"] = "ok"|"nok"|""
var sigCtx = {};
var sigOn = {};

function buildTabs() {
  var t = document.getElementById("tabs");
  EQUIPEMENTS.forEach(function(eq, ei) {
    var d = document.createElement("div");
    d.className = "tab" + (ei===0?" active":"");
    d.textContent = eq.court;
    d.onclick = function(){ showEq(ei); };
    t.appendChild(d);
  });
}

function showEq(n) {
  document.querySelectorAll(".eq-panel").forEach(function(p){ p.classList.remove("active"); });
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
  document.getElementById("panel"+n).classList.add("active");
  document.querySelectorAll(".tab")[n].classList.add("active");
  document.getElementById("alertOk").classList.remove("show");
  window.scrollTo(0,0);
  setTimeout(function(){ initSig("sig"+n); }, 100);
}

function buildPanels() {
  var cont = document.getElementById("panels");
  EQUIPEMENTS.forEach(function(eq, ei) {
    var panel = document.createElement("div");
    panel.className = "eq-panel" + (ei===0?" active":"");
    panel.id = "panel"+ei;

    // Infos
    var html = '<div class="card"><div class="card-hdr h-noir">Informations — '+eq.nom+'</div><div class="card-body">';
    html += '<div class="field"><label>Date de l\u0027inspection</label><input type="date" id="date'+ei+'"></div>';
    html += '<div class="fg2">';
    eq.infos.forEach(function(f){
      html += '<div class="field"><label>'+f[1]+'</label><input type="text" id="'+f[0]+ei+'"></div>';
    });
    html += '</div>';
    html += '<div class="fg2"><div class="field"><label>Nom du travailleur</label><input type="text" id="trav'+ei+'"></div>';
    html += '<div class="field"><label>Sous-traitant</label><input type="text" id="st'+ei+'"></div></div>';
    html += '</div></div>';

    // Sections d'inspection
    eq.sections.forEach(function(sec, si) {
      html += '<div class="card">';
      html += '<div class="section-titre">'+sec.titre+'<div class="jours"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span></div></div>';
      sec.items.forEach(function(item, ii) {
        html += '<div class="insp-row">';
        html += '<div class="insp-num">'+(ii+1)+'</div>';
        html += '<div class="insp-lbl">'+item+'</div>';
        html += '<div class="insp-days">';
        for(var j=0;j<5;j++){
          html += '<div class="day-cell" id="d_'+ei+'_'+si+'_'+ii+'_'+j+'" onclick="cycle('+ei+','+si+','+ii+','+j+')"></div>';
        }
        html += '</div></div>';
      });
      // Ligne initiales
      html += '<div class="initiales-row"><div class="insp-num"></div>';
      html += '<div class="insp-lbl">Initiales du travailleur</div><div class="insp-days">';
      for(var j=0;j<5;j++){
        html += '<div class="init-cell"><input type="text" maxlength="3" id="ini_'+ei+'_'+si+'_'+j+'"></div>';
      }
      html += '</div></div>';
      html += '</div>';
    });

    // Non-conformités
    html += '<div class="card nonconf" id="nc'+ei+'"><div class="card-hdr h-rougeD">⚠️ Non-conformités détectées</div><div class="card-body">';
    html += '<div class="field"><label>Description et mesures correctives</label><textarea id="desc'+ei+'"></textarea></div>';
    html += '<div class="fg2"><div class="field"><label>Hors service?</label><select id="hs'+ei+'"><option value="non">Non</option><option value="oui">Oui — retiré</option></select></div>';
    html += '<div class="field"><label>Superviseur avisé</label><input type="text" id="sup'+ei+'"></div></div></div></div>';

    // Signature + boutons
    html += '<div class="card"><div class="card-hdr h-rouge">✍ Signature du travailleur</div><div class="card-body">';
    html += '<p style="font-size:11px;color:#666;margin-bottom:8px;">La vérification doit être faite dans un endroit stable et sécuritaire.</p>';
    html += '<canvas class="sig" id="sig'+ei+'" height="120"></canvas>';
    html += '<button class="btn-clear" onclick="clearSig(\u0027sig'+ei+'\u0027)">Effacer</button>';
    html += '<button class="btn-sub" onclick="soumettre('+ei+')">📤 Envoyer l\u0027inspection</button>';
    html += '<button class="btn-pdf" onclick="genPDF('+ei+')">📄 Générer PDF</button>';
    html += '</div></div>';

    panel.innerHTML = html;
    cont.appendChild(panel);

}

function cycle(ei, si, ii, j) {
  var key = ei+"_"+si+"_"+ii+"_"+j;
  var cur = S[key]||"";
  var next = cur===""?"ok":cur==="ok"?"nok":"";
  S[key]=next;
  var cell = document.getElementById("d_"+key);
  cell.className = "day-cell"+(next?" "+next:"");
  cell.innerHTML = next==="ok"?"✓":next==="nok"?"✗":"";
  updateNC(ei);
}

function updateNC(ei) {
  var hasNok = Object.keys(S).some(function(k){ return k.indexOf(ei+"_")===0 && S[k]==="nok"; });
  document.getElementById("nc"+ei).classList.toggle("show", hasNok);
}

// SIGNATURE
function initSig(id) {
  var c = document.getElementById(id); if(!c||c.dataset.init) return;
  c.dataset.init="1";
  var dpr=window.devicePixelRatio||1, w=c.offsetWidth||300;
  c.width=w*dpr; c.height=120*dpr; c.style.height="120px";
  var ctx=c.getContext("2d");
  ctx.scale(dpr,dpr); ctx.strokeStyle="#1a1a1a"; ctx.lineWidth=2.5; ctx.lineCap="round"; ctx.lineJoin="round";
  sigCtx[id]=ctx; sigOn[id]=false;
  function pos(e){var r=c.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:s.clientX-r.left,y:s.clientY-r.top};}
  c.addEventListener("mousedown",function(e){sigOn[id]=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();});
  c.addEventListener("mousemove",function(e){if(!sigOn[id])return;var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();});
  c.addEventListener("mouseup",function(){sigOn[id]=false;});
  c.addEventListener("touchstart",function(e){sigOn[id]=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();},{passive:false});
  c.addEventListener("touchmove",function(e){if(!sigOn[id])return;var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();},{passive:false});
  c.addEventListener("touchend",function(){sigOn[id]=false;});
}
function clearSig(id){var c=document.getElementById(id),ctx=sigCtx[id];if(c&&ctx)ctx.clearRect(0,0,c.width,c.height);}
function hasSig(id){var c=document.getElementById(id),ctx=sigCtx[id];if(!c||!ctx)return false;try{var px=ctx.getImageData(0,0,c.width,c.height).data;for(var i=3;i<px.length;i+=4){if(px[i]>0)return true;}}catch(e){}return false;}

// ENVOI
function envoyer(params, cb) {
  var url = APPS_URL+"?"+Object.keys(params).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(String(params[k]||""));}).join("&");
  var img=new Image(); img.onload=img.onerror=function(){}; img.src=url;
  try{ fetch(url,{method:"GET",mode:"no-cors"}).catch(function(){}); }catch(e){}
  setTimeout(function(){ if(cb)cb(); },2000);
}

function compterEq(ei) {
  var ok=0,nok=0,noks=[];
  var eq=EQUIPEMENTS[ei];
  eq.sections.forEach(function(sec,si){
    sec.items.forEach(function(item,ii){
      for(var j=0;j<5;j++){
        var v=S[ei+"_"+si+"_"+ii+"_"+j];
        if(v==="ok")ok++;
        else if(v==="nok"){nok++; if(noks.indexOf(item)<0)noks.push(item);}
      }
    });
  });
  return {ok:ok,nok:nok,noks:noks};
}

function soumettre(ei) {
  var eq=EQUIPEMENTS[ei];
  var date=document.getElementById("date"+ei).value;
  var trav=document.getElementById("trav"+ei).value;
  var st=document.getElementById("st"+ei).value;
  if(!date||!trav||!st){ showToast("Remplissez la date, le travailleur et le sous-traitant"); return; }

  var c=compterEq(ei);
  var marque=document.getElementById("marque"+ei).value;
  var modele=document.getElementById("modele"+ei).value;
  var desc=document.getElementById("desc"+ei)?document.getElementById("desc"+ei).value:"";
  var hs=document.getElementById("hs"+ei)?document.getElementById("hs"+ei).value:"non";
  var sup=document.getElementById("sup"+ei)?document.getElementById("sup"+ei).value:"";
  var statut=c.nok>0?"NON CONFORME":"CONFORME";

  // Historique local
  var entry={date:date,eq:eq.nom,trav:trav,st:st,ok:c.ok,nok:c.nok,statut:statut,hs:hs};
  var hist=[]; try{hist=JSON.parse(localStorage.getItem("insp5")||"[]");}catch(e){}
  hist.unshift(entry); hist=hist.slice(0,50);
  try{localStorage.setItem("insp5",JSON.stringify(hist));}catch(e){}
  renderHist();

  var btn=document.querySelector("#panel"+ei+" .btn-sub");
  if(btn){btn.disabled=true;btn.textContent="⏳ Envoi en cours...";}

  envoyer({
    type:"inspection",
    date:date, equipement:eq.nom, travailleur:trav, sousTraitant:st,
    marqueModele:marque+" "+modele,
    ok:c.ok, nok:c.nok,
    nonConformites:c.noks.join("; "),
    description:desc, horsService:hs, superviseur:sup,
    signature:hasSig("sig"+ei)?"Signe":"Non signe"
  }, function(){
    if(btn){btn.disabled=false;btn.textContent="✅ Envoyé! (toucher pour renvoyer)";}
    document.getElementById("alertOk").classList.add("show");
    window.scrollTo(0,0);
    setTimeout(function(){ if(btn) btn.textContent="📤 Envoyer l\u0027inspection"; },4000);
  });
}

function genPDF(ei) {
  var eq=EQUIPEMENTS[ei];
  var get=function(id){var e=document.getElementById(id);return e?e.value:"";};
  var w=window.open("","_blank");
  if(!w){showToast("Autorisez les popups");return;}

  var secHtml="";
  eq.sections.forEach(function(sec,si){
    secHtml+="<tr><td colspan='7' style='background:#2E7D52;color:#fff;padding:5px 8px;font-size:11px;font-weight:700;'>"+sec.titre+" &nbsp;&nbsp; L M M J V</td></tr>";
    sec.items.forEach(function(item,ii){
      var cells="";
      for(var j=0;j<5;j++){var v=S[ei+"_"+si+"_"+ii+"_"+j];cells+="<td style='border:1px solid #999;width:26px;text-align:center;font-weight:700;color:"+(v==="nok"?"#C8102E":"#2E7D52")+";'>"+(v==="ok"?"✓":v==="nok"?"✗":"")+"</td>";}
      secHtml+="<tr><td style='border:1px solid #999;width:24px;text-align:center;font-size:10px;'>"+(ii+1)+"</td><td style='border:1px solid #999;padding:4px 6px;font-size:11px;'>"+item+"</td>"+cells+"</tr>";
    });
  });

function renderHist() {
  var hist=[]; try{hist=JSON.parse(localStorage.getItem("insp5")||"[]");}catch(e){}
  var el=document.getElementById("historique");
  if(!hist.length){el.innerHTML="<p style='font-size:12px;color:#888;'>Aucune inspection soumise.</p>";return;}
  el.innerHTML=hist.slice(0,10).map(function(h){
    var c=h.nok>0?"#C8102E":"#2E7D52";
    return "<div class='hist-item'><div style='display:flex;justify-content:space-between;'>"
      +"<div><div style='font-size:13px;font-weight:700;'>"+h.date+" — "+h.eq+"</div>"
      +"<div style='font-size:11px;color:#666;'>"+h.trav+" · "+h.st+"</div></div>"
      +"<div style='font-size:12px;font-weight:700;color:"+c+";'>"+h.statut+"</div></div>"
      +"<div style='font-size:11px;color:#666;margin-top:4px;'>Conforme: "+h.ok+" | Non conforme: "+h.nok
      +(h.hs==="oui"?" | <strong style='color:#C8102E;'>HORS SERVICE</strong>":"")+"</div></div>";
  }).join("");
}
